name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

env:
  KSU_VERSION_BASE: "4.1.6"

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute versionCode and tag
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((30000 + COMMIT_COUNT))
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=v${KSU_VERSION_BASE}_${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${KSU_VERSION_BASE}_${VERSION_CODE}" >> "$GITHUB_OUTPUT"

  build-manager:
    needs: prep
    uses: ./.github/workflows/build-manager.yml
    with:
      ksu_version_name: ${{ needs.prep.outputs.version_name }}
    secrets: inherit

  release:
    needs: [build-manager, prep]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download manager apk
        uses: actions/download-artifact@v8
        with:
          name: manager
          path: manager

      - name: Create tag if missing
        run: |
          TAG="${{ needs.prep.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          else
            echo "Tag $TAG already exists, using it"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prep.outputs.tag }}
          name: ${{ needs.prep.outputs.tag }}
          target_commitish: main
          files: manager/*.apk
          generate_release_notes: true
